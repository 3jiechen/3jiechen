<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7ff"/>
      <stop offset="0.55" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#5a7390" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto">
      <path d="M2,2 L11,6 L2,10 Z" fill="#37658c"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; }
      .small { letter-spacing: 0.2px; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="640" y="54" text-anchor="middle" font-size="30" font-weight="800" fill="#112f4a">本文对比模型体系</text>
  <text x="640" y="88" text-anchor="middle" font-size="18" font-weight="500" fill="#5b7288">通过单模态基线与多模态融合模型分析不同特征归纳偏置的贡献</text>
  <rect x="60" y="150" width="250" height="410" rx="20" fill="#ffffff" stroke="#2d6cdf" stroke-width="2.5" filter="url(#shadow)"/>
<text x="185" y="186" text-anchor="middle" font-size="22" font-weight="700" fill="#14395b">TinyCNN</text>
<text x="185" y="220" text-anchor="middle" font-size="17" fill="#27445e">输入：2 x 64 x 64</text>
<text x="185" y="244" text-anchor="middle" font-size="17" fill="#27445e">少量卷积层</text>
<text x="185" y="268" text-anchor="middle" font-size="17" fill="#27445e">训练快、参数少</text>
<text x="185" y="292" text-anchor="middle" font-size="17" fill="#27445e">适合嵌入式候选</text><rect x="365" y="150" width="250" height="410" rx="20" fill="#f9fdff" stroke="#2d6cdf" stroke-width="2.5" filter="url(#shadow)"/>
<text x="490" y="186" text-anchor="middle" font-size="22" font-weight="700" fill="#14395b">ResNet18 谱域</text>
<text x="490" y="220" text-anchor="middle" font-size="17" fill="#27445e">首层改为 2 通道</text>
<text x="490" y="244" text-anchor="middle" font-size="17" fill="#27445e">残差结构提取纹理</text>
<text x="490" y="268" text-anchor="middle" font-size="17" fill="#27445e">输出 512 维特征</text>
<text x="490" y="292" text-anchor="middle" font-size="17" fill="#27445e">谱域强基线</text><rect x="670" y="150" width="250" height="410" rx="20" fill="#ffffff" stroke="#2d6cdf" stroke-width="2.5" filter="url(#shadow)"/>
<text x="795" y="186" text-anchor="middle" font-size="22" font-weight="700" fill="#14395b">RNN1D 时域</text>
<text x="795" y="220" text-anchor="middle" font-size="17" fill="#27445e">输入：1 x 4096</text>
<text x="795" y="244" text-anchor="middle" font-size="17" fill="#27445e">序列动态建模</text>
<text x="795" y="268" text-anchor="middle" font-size="17" fill="#27445e">关注包络与瞬态</text>
<text x="795" y="292" text-anchor="middle" font-size="17" fill="#27445e">单模态对照</text><rect x="975" y="150" width="250" height="410" rx="20" fill="#f9fdff" stroke="#2d6cdf" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1100" y="186" text-anchor="middle" font-size="22" font-weight="700" fill="#14395b">FusionRNNResNet</text>
<text x="1100" y="220" text-anchor="middle" font-size="17" fill="#27445e">BiLSTM 时域分支</text>
<text x="1100" y="244" text-anchor="middle" font-size="17" fill="#27445e">ResNet18 谱域分支</text>
<text x="1100" y="268" text-anchor="middle" font-size="17" fill="#27445e">concat 特征融合</text>
<text x="1100" y="292" text-anchor="middle" font-size="17" fill="#27445e">重点研究模型</text><rect x="95" y="600" width="180" height="46" rx="23" fill="#e9f4ff" stroke="#7fb2e5" stroke-width="1.6"/><text x="185" y="630" text-anchor="middle" font-size="17" font-weight="500" fill="#1f4e78">轻量谱域基线</text><rect x="400" y="600" width="180" height="46" rx="23" fill="#e9f4ff" stroke="#7fb2e5" stroke-width="1.6"/><text x="490" y="630" text-anchor="middle" font-size="17" font-weight="500" fill="#1f4e78">深层谱域模型</text><rect x="705" y="600" width="180" height="46" rx="23" fill="#e9f4ff" stroke="#7fb2e5" stroke-width="1.6"/><text x="795" y="630" text-anchor="middle" font-size="17" font-weight="500" fill="#1f4e78">时域序列模型</text><rect x="1010" y="600" width="180" height="46" rx="23" fill="#e9f4ff" stroke="#7fb2e5" stroke-width="1.6"/><text x="1100" y="630" text-anchor="middle" font-size="17" font-weight="500" fill="#1f4e78">时频融合模型</text>
</svg>
