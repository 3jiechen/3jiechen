<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="76.0mm" viewBox="0 0 1500 760">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L11,6 L2,10 Z" fill="#4a4a4a"/>
    </marker>
    <style>
      text { font-family: "SimSun", "Songti SC", "Noto Serif CJK SC", serif; dominant-baseline: alphabetic; }
      rect, path, line, polyline { vector-effect: non-scaling-stroke; }
    </style>
  </defs>
  <rect width="1500" height="760" fill="#ffffff"/>
  <rect x="676" y="28" width="148" height="38" rx="19" fill="#edf4fb" stroke="#2f5f8f" stroke-width="1.6"/><text x="750" y="54" text-anchor="middle" font-size="20" font-weight="700" fill="#2f5f8f">深度学习模型结构概述</text><rect x="70" y="105" width="1360" height="70" rx="10" fill="#edf4fb" stroke="#2f5f8f" stroke-width="1.8"/><text x="750" y="150" text-anchor="middle" font-size="24" font-weight="400" fill="#1f1f1f">深度学习通过多层神经网络从波形或谱图中自动学习判别性特征，减少对人工特征设计的依赖</text><rect x="95" y="245" width="250" height="125" rx="8" fill="#f6f6f6" stroke="#4a4a4a" stroke-width="2"/>
<text x="220" y="284" text-anchor="middle" font-size="24" font-weight="700" fill="#1f1f1f">一维时域波形</text>
<text x="220" y="321" text-anchor="middle" font-size="20" font-weight="400" fill="#4c4c4c">4096 点序列</text>
<text x="220" y="351" text-anchor="middle" font-size="20" font-weight="400" fill="#4c4c4c">幅度 / 相位变化规律</text><rect x="95" y="460" width="250" height="125" rx="8" fill="#edf4fb" stroke="#4a4a4a" stroke-width="2"/>
<text x="220" y="499" text-anchor="middle" font-size="24" font-weight="700" fill="#1f1f1f">STFT 双通道谱图</text>
<text x="220" y="536" text-anchor="middle" font-size="20" font-weight="400" fill="#4c4c4c">幅值谱 + 相位谱</text>
<text x="220" y="566" text-anchor="middle" font-size="20" font-weight="400" fill="#4c4c4c">局部时频纹理</text><rect x="455" y="245" width="280" height="125" rx="8" fill="#ffffff" stroke="#4a4a4a" stroke-width="2"/>
<text x="595" y="284" text-anchor="middle" font-size="24" font-weight="700" fill="#1f1f1f">LSTM 时域分支</text>
<text x="595" y="321" text-anchor="middle" font-size="20" font-weight="400" fill="#4c4c4c">门控机制保留长时信息</text>
<text x="595" y="351" text-anchor="middle" font-size="20" font-weight="400" fill="#4c4c4c">建模序列依赖关系</text><rect x="455" y="460" width="280" height="125" rx="8" fill="#ffffff" stroke="#4a4a4a" stroke-width="2"/>
<text x="595" y="499" text-anchor="middle" font-size="24" font-weight="700" fill="#1f1f1f">CNN / ResNet 谱图分支</text>
<text x="595" y="536" text-anchor="middle" font-size="20" font-weight="400" fill="#4c4c4c">局部连接与权值共享</text>
<text x="595" y="566" text-anchor="middle" font-size="20" font-weight="400" fill="#4c4c4c">残差连接稳定深层训练</text><rect x="860" y="335" width="260" height="145" rx="8" fill="#eef7ef" stroke="#4a4a4a" stroke-width="2"/>
<text x="990" y="374" text-anchor="middle" font-size="24" font-weight="700" fill="#1f1f1f">多分支特征融合</text>
<text x="990" y="411" text-anchor="middle" font-size="20" font-weight="400" fill="#4c4c4c">拼接时域与谱域表示</text>
<text x="990" y="441" text-anchor="middle" font-size="20" font-weight="400" fill="#4c4c4c">增强低信噪比鲁棒性</text><rect x="1235" y="335" width="190" height="145" rx="8" fill="#fff3e6" stroke="#4a4a4a" stroke-width="2"/>
<text x="1330" y="374" text-anchor="middle" font-size="24" font-weight="700" fill="#1f1f1f">制式分类</text>
<text x="1330" y="411" text-anchor="middle" font-size="20" font-weight="400" fill="#4c4c4c">Softmax 输出</text>
<text x="1330" y="441" text-anchor="middle" font-size="20" font-weight="400" fill="#4c4c4c">9 类调制标签</text><line x1="345" y1="308" x2="455" y2="308" stroke="#4a4a4a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="400" y="298" text-anchor="middle" font-size="18" font-weight="400" fill="#4c4c4c">序列建模</text><line x1="345" y1="522" x2="455" y2="522" stroke="#4a4a4a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="400" y="512" text-anchor="middle" font-size="18" font-weight="400" fill="#4c4c4c">局部纹理</text><line x1="735" y1="308" x2="860" y2="382" stroke="#4a4a4a" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="735" y1="522" x2="860" y2="432" stroke="#4a4a4a" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1120" y1="407" x2="1235" y2="407" stroke="#4a4a4a" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="220" y1="370" x2="220" y2="460" stroke="#4a4a4a" stroke-width="1.6" stroke-dasharray="8 7"/><line x1="595" y1="370" x2="595" y2="460" stroke="#4a4a4a" stroke-width="1.6" stroke-dasharray="8 7"/><text x="750" y="672" text-anchor="middle" font-size="23" font-weight="400" fill="#1f1f1f">图示关系：CNN/ResNet 侧重谱图局部稳健特征，LSTM 侧重长时依赖，多分支融合用于提升抗噪识别能力</text>
</svg>
