<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7ff"/>
      <stop offset="0.55" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#5a7390" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto">
      <path d="M2,2 L11,6 L2,10 Z" fill="#37658c"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; }
      .small { letter-spacing: 0.2px; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="640" y="54" text-anchor="middle" font-size="30" font-weight="800" fill="#112f4a">MAT 波形样本预处理流程</text>
  <text x="640" y="88" text-anchor="middle" font-size="18" font-weight="500" fill="#5b7288">固定长度、归一化、STFT 与 AWGN 增强构成统一数据入口</text>
  <rect x="70" y="145" width="190" height="120" rx="20" fill="#ffffff" stroke="#2d6cdf" stroke-width="2.5" filter="url(#shadow)"/>
<text x="165" y="181" text-anchor="middle" font-size="22" font-weight="700" fill="#14395b">数据输入</text>
<text x="165" y="215" text-anchor="middle" font-size="17" fill="#27445e">11k8m/11k8m</text>
<text x="165" y="239" text-anchor="middle" font-size="17" fill="#27445e">类别文件夹</text>
<text x="165" y="263" text-anchor="middle" font-size="17" fill="#27445e">.mat 波形</text><rect x="315" y="145" width="190" height="120" rx="20" fill="#f9fdff" stroke="#2d6cdf" stroke-width="2.5" filter="url(#shadow)"/>
<text x="410" y="181" text-anchor="middle" font-size="22" font-weight="700" fill="#14395b">样本读取</text>
<text x="410" y="215" text-anchor="middle" font-size="17" fill="#27445e">scipy.io.loadmat</text>
<text x="410" y="239" text-anchor="middle" font-size="17" fill="#27445e">一维波形展开</text>
<text x="410" y="263" text-anchor="middle" font-size="17" fill="#27445e">label_map 编码</text><rect x="560" y="145" width="190" height="120" rx="20" fill="#ffffff" stroke="#2d6cdf" stroke-width="2.5" filter="url(#shadow)"/>
<text x="655" y="181" text-anchor="middle" font-size="22" font-weight="700" fill="#14395b">长度统一</text>
<text x="655" y="215" text-anchor="middle" font-size="17" fill="#27445e">截断过长样本</text>
<text x="655" y="239" text-anchor="middle" font-size="17" fill="#27445e">零填充短样本</text>
<text x="655" y="263" text-anchor="middle" font-size="17" fill="#27445e">SIGNAL_LENGTH=4096</text><rect x="805" y="145" width="190" height="120" rx="20" fill="#f9fdff" stroke="#2d6cdf" stroke-width="2.5" filter="url(#shadow)"/>
<text x="900" y="181" text-anchor="middle" font-size="22" font-weight="700" fill="#14395b">时域归一化</text>
<text x="900" y="215" text-anchor="middle" font-size="17" fill="#27445e">零均值</text>
<text x="900" y="239" text-anchor="middle" font-size="17" fill="#27445e">单位方差</text>
<text x="900" y="263" text-anchor="middle" font-size="17" fill="#27445e">稳定训练</text><rect x="1050" y="145" width="190" height="120" rx="20" fill="#ffffff" stroke="#2d6cdf" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1145" y="181" text-anchor="middle" font-size="22" font-weight="700" fill="#14395b">可选增强</text>
<text x="1145" y="215" text-anchor="middle" font-size="17" fill="#27445e">AWGN</text>
<text x="1145" y="239" text-anchor="middle" font-size="17" fill="#27445e">SNR 区间采样</text>
<text x="1145" y="263" text-anchor="middle" font-size="17" fill="#27445e">增强鲁棒性</text><line x1="260" y1="205" x2="315" y2="205" stroke="#37658c" stroke-width="3" marker-end="url(#arrow)"/><line x1="505" y1="205" x2="560" y2="205" stroke="#37658c" stroke-width="3" marker-end="url(#arrow)"/><line x1="750" y1="205" x2="805" y2="205" stroke="#37658c" stroke-width="3" marker-end="url(#arrow)"/><line x1="995" y1="205" x2="1050" y2="205" stroke="#37658c" stroke-width="3" marker-end="url(#arrow)"/><line x1="900" y1="265" x2="760" y2="400" stroke="#37658c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="830" y="322" text-anchor="middle" font-size="15" font-weight="500" fill="#48657a">时域分支</text><line x1="1135" y1="265" x2="995" y2="400" stroke="#37658c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1065" y="322" text-anchor="middle" font-size="15" font-weight="500" fill="#48657a">谱域分支</text><rect x="510" y="410" width="260" height="130" rx="20" fill="#eef7ff" stroke="#77a9dc" stroke-width="2.5" filter="url(#shadow)"/>
<text x="640" y="446" text-anchor="middle" font-size="22" font-weight="700" fill="#14395b">Time Feature</text>
<text x="640" y="480" text-anchor="middle" font-size="17" fill="#27445e">1 x 4096</text>
<text x="640" y="504" text-anchor="middle" font-size="17" fill="#27445e">RNN1D / BiLSTM</text>
<text x="640" y="528" text-anchor="middle" font-size="17" fill="#27445e">动态包络信息</text><rect x="890" y="410" width="260" height="130" rx="20" fill="#fff7ed" stroke="#f0a04b" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1020" y="446" text-anchor="middle" font-size="22" font-weight="700" fill="#14395b">STFT Feature</text>
<text x="1020" y="480" text-anchor="middle" font-size="17" fill="#27445e">2 x 64 x 64</text>
<text x="1020" y="504" text-anchor="middle" font-size="17" fill="#27445e">幅度 + 相位</text>
<text x="1020" y="528" text-anchor="middle" font-size="17" fill="#27445e">CNN / ResNet 输入</text><line x1="770" y1="475" x2="855" y2="475" stroke="#37658c" stroke-width="3" marker-end="url(#arrow)"/><rect x="625" y="590" width="410" height="80" rx="20" fill="#f0fff5" stroke="#52b879" stroke-width="2.5" filter="url(#shadow)"/>
<text x="830" y="626" text-anchor="middle" font-size="22" font-weight="700" fill="#14395b">DataLoader 批处理：统一输入张量、标签与训练 / 评估流程</text>
</svg>
