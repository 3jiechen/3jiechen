<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7ff"/>
      <stop offset="0.55" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#5a7390" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto">
      <path d="M2,2 L11,6 L2,10 Z" fill="#37658c"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; }
      .small { letter-spacing: 0.2px; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="640" y="54" text-anchor="middle" font-size="30" font-weight="800" fill="#112f4a">FusionRNNResNet 时频融合网络结构</text>
  <text x="640" y="88" text-anchor="middle" font-size="18" font-weight="500" fill="#5b7288">双向 LSTM 捕获时域动态，ResNet18 捕获谱域纹理，融合后完成分类</text>
  <rect x="60" y="155" width="230" height="110" rx="20" fill="#ffffff" stroke="#2d6cdf" stroke-width="2.5" filter="url(#shadow)"/>
<text x="175" y="191" text-anchor="middle" font-size="22" font-weight="700" fill="#14395b">归一化波形</text>
<text x="175" y="225" text-anchor="middle" font-size="17" fill="#27445e">1 x 4096</text><rect x="60" y="455" width="230" height="110" rx="20" fill="#ffffff" stroke="#2d6cdf" stroke-width="2.5" filter="url(#shadow)"/>
<text x="175" y="491" text-anchor="middle" font-size="22" font-weight="700" fill="#14395b">STFT 特征</text>
<text x="175" y="525" text-anchor="middle" font-size="17" fill="#27445e">2 x 64 x 64</text><line x1="290" y1="210" x2="410" y2="210" stroke="#37658c" stroke-width="3" marker-end="url(#arrow)"/><line x1="290" y1="510" x2="410" y2="510" stroke="#37658c" stroke-width="3" marker-end="url(#arrow)"/><rect x="410" y="145" width="260" height="130" rx="20" fill="#eef7ff" stroke="#77a9dc" stroke-width="2.5" filter="url(#shadow)"/>
<text x="540" y="181" text-anchor="middle" font-size="22" font-weight="700" fill="#14395b">时域分支</text>
<text x="540" y="215" text-anchor="middle" font-size="17" fill="#27445e">BiLSTM 多层堆叠</text>
<text x="540" y="239" text-anchor="middle" font-size="17" fill="#27445e">Dropout</text>
<text x="540" y="263" text-anchor="middle" font-size="17" fill="#27445e">时间维均值池化</text><rect x="410" y="445" width="260" height="130" rx="20" fill="#fff7ed" stroke="#f0a04b" stroke-width="2.5" filter="url(#shadow)"/>
<text x="540" y="481" text-anchor="middle" font-size="22" font-weight="700" fill="#14395b">谱域分支</text>
<text x="540" y="515" text-anchor="middle" font-size="17" fill="#27445e">ResNet18 Backbone</text>
<text x="540" y="539" text-anchor="middle" font-size="17" fill="#27445e">去除最终 FC</text>
<text x="540" y="563" text-anchor="middle" font-size="17" fill="#27445e">512 维谱域特征</text><line x1="670" y1="210" x2="810" y2="335" stroke="#37658c" stroke-width="3" marker-end="url(#arrow)"/><line x1="670" y1="510" x2="810" y2="385" stroke="#37658c" stroke-width="3" marker-end="url(#arrow)"/><rect x="800" y="300" width="210" height="120" rx="20" fill="#f0fff5" stroke="#52b879" stroke-width="2.5" filter="url(#shadow)"/>
<text x="905" y="336" text-anchor="middle" font-size="22" font-weight="700" fill="#14395b">特征拼接</text>
<text x="905" y="370" text-anchor="middle" font-size="17" fill="#27445e">torch.cat([t, f])</text>
<text x="905" y="394" text-anchor="middle" font-size="17" fill="#27445e">时域 + 谱域</text><line x1="1010" y1="360" x2="1110" y2="360" stroke="#37658c" stroke-width="3" marker-end="url(#arrow)"/><rect x="1110" y="290" width="130" height="140" rx="20" fill="#ffffff" stroke="#2d6cdf" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1175" y="326" text-anchor="middle" font-size="22" font-weight="700" fill="#14395b">分类器</text>
<text x="1175" y="360" text-anchor="middle" font-size="17" fill="#27445e">MLP</text>
<text x="1175" y="384" text-anchor="middle" font-size="17" fill="#27445e">Dropout</text>
<text x="1175" y="408" text-anchor="middle" font-size="17" fill="#27445e">9 类 logits</text><text x="535" y="325" text-anchor="middle" font-size="17" font-weight="500" fill="#2f5f8f">时域动态：包络、瞬态、长时相关</text><text x="535" y="625" text-anchor="middle" font-size="17" font-weight="500" fill="#a05a1a">谱域纹理：谐波、频带、时频局部模式</text><text x="905" y="470" text-anchor="middle" font-size="18" font-weight="700" fill="#2f6b43">互补信息在特征层融合</text>
</svg>
